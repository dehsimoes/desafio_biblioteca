spring:
  application:
    name: biblioteca

  data:
    mongodb:
      uri: mongodb://localhost:27017/biblioteca
      auto-index-creation: true
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.dbc.biblioteca: DEBUG
    org.springframework.cache: DEBUG